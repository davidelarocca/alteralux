name: CI

# A change to documents alone runs nothing. Two documents are read by the checks, so they count
# as code: the layout contract (the layout tests) and the architecture contracts.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!.claude/**"
      - "docs/LAYOUT_CONTRACT.md"
      - "docs/architecture-contracts.json"
  pull_request:
    # The same list as above.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!.claude/**"
      - "docs/LAYOUT_CONTRACT.md"
      - "docs/architecture-contracts.json"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  engine-linux:
    name: Rust bridge tests (Linux)
    runs-on: ubuntu-latest
    env:
      # Runners have different CPUs and the build is cached between them, so
      # OpenBLAS must not be tuned for the machine that happened to build it.
      OPENBLAS_TARGET: GENERIC
      OPENBLAS_DYNAMIC_ARCH: "1"
    steps:
      # These tests cover the Rust bridge: they run when the engine or this workflow changed.
      # When the list of changed files cannot be read, or is cut short, they run.
      - name: Did the engine change?
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if ! changed="$(gh api "repos/${{ github.repository }}/compare/${BASE}...${HEAD}" --jq '.files[].filename')"; then
            changed=""
          fi
          count="$(grep -c . <<<"$changed" || true)"
          if [ -z "$changed" ] || [ "$count" -ge 300 ] || grep -qE '^(engine/|\.gitmodules$|\.github/workflows/)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "The engine did not change: its tests are skipped."
          fi
      - uses: actions/checkout@v7
        if: steps.engine.outputs.run == 'true'
        with:
          submodules: recursive
      # OpenBLAS (CPU matrix maths on Linux) is compiled from source by the
      # openblas-src crate; rust-cache keeps it between runs.
      - uses: Swatinem/rust-cache@v2
        if: steps.engine.outputs.run == 'true'
        with:
          workspaces: engine
      - name: Test
        if: steps.engine.outputs.run == 'true'
        # Release mode: the tests run real renders, which are slow unoptimized.
        run: cargo test --release --manifest-path engine/Cargo.toml -p alteralux-ffi

  swift-macos:
    name: Swift packages and app (macOS, Apple silicon)
    # Latest Xcode / Swift / macOS SDK on Apple silicon.
    runs-on: xcode-27
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat
      - name: Toolchain versions
        run: |
          sw_vers && xcodebuild -version && swift --version && rustc --version
          swiftlint version && swiftformat --version
      - name: Build the engine and generate the Xcode project
        run: scripts/bootstrap.sh
      # The project's own verification, the same command a developer runs
      # before merging: tests of the Swift packages, a build of the app and
      # SwiftLint in strict mode.
      - name: Verify (scripts/verify.sh full)
        run: scripts/verify.sh full
      # The images a failing snapshot drew, with their diff and reason, for a look without
      # running the tests again. Before the summary: a rerun that passes removes them.
      - name: Upload the snapshots that failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-snapshots
          path: .build/swift-harness/snapshots
          if-no-files-found: ignore
      # verify.sh shows only the end of each test run: list every test here, and
      # what each failing one reported. It runs after a failed verification too:
      # that is when the names are needed.
      - name: Test summary
        if: ${{ !cancelled() }}
        run: |
          for package in apple/DesignSystem apple/AlteraluxKit; do
            echo "== $package"
            swift test --package-path "$package" --skip-build 2>&1 | grep -E "^(✔|✘) (Test|Suite)|recorded an issue|^swift-harness snapshot problem:|Test run with" || true
          done
      # Informational: the files SwiftFormat would change. Formatting is applied
      # by the developer's tools, not enforced here.
      - name: Formatting report
        run: swiftformat --lint . || true
      - name: Build the app (Release)
        run: |
          xcodebuild build \
            -project apple/Alteralux.xcodeproj \
            -scheme Alteralux \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation
      - name: Check the app bundle
        run: |
          APP=build/DerivedData/Build/Products/Release/Alteralux.app
          test -d "$APP/Contents/Resources/data/profiles"
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q app-sandbox
      - name: Smoke test (launch the app, open a test chart, take a screenshot)
        run: scripts/ci/smoke-test.sh build/DerivedData/Build/Products/Release/Alteralux.app
      - name: Upload the smoke test screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test
          path: build/smoke
          if-no-files-found: ignore
      # Debug aid for reviewing the UI from the log alone: add the label
      # "ci-screenshot" to a pull request to print a small copy of the
      # screenshot as base64.
      - name: Print the screenshot into the log
        if: contains(github.event.pull_request.labels.*.name, 'ci-screenshot')
        run: |
          sips -Z 1400 -s format jpeg -s formatOptions 60 \
            build/smoke/screenshot.png --out build/smoke/screenshot-small.jpg >/dev/null
          echo "::group::screenshot (base64 JPEG)"
          echo "-----BEGIN SCREENSHOT-----"
          base64 -b 76 -i build/smoke/screenshot-small.jpg
          echo "-----END SCREENSHOT-----"
          echo "::endgroup::"
      - name: Package the app
        run: |
          mkdir -p build/package
          ditto -c -k --keepParent \
            build/DerivedData/Build/Products/Release/Alteralux.app \
            build/package/Alteralux.zip
      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: Alteralux-app
          path: build/package/Alteralux.zip
