# Xcode project definition (https://github.com/yonaskolb/XcodeGen).
# Run scripts/bootstrap.sh to generate apple/Alteralux.xcodeproj from it.
name: Alteralux

options:
  bundleIdPrefix: io.github.davidelarocca
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  AlteraluxKit:
    path: AlteraluxKit
  DesignSystem:
    path: DesignSystem

targets:
  Alteralux:
    type: application
    platform: macOS
    sources:
      - path: Alteralux
        # Referenced through build settings, not compiled or copied.
        excludes:
          - Info.plist
          - "*.entitlements"
          - "*.xcconfig"
      # Film and paper profiles and spectral tables, straight from the engine
      # submodule. Copied as a folder to Contents/Resources/data.
      - path: ../engine/vendor/spektrafilm-rs/data
        type: folder
        buildPhase: resources
    dependencies:
      # The screens and the app model. The app target itself is only a shell.
      - package: AlteraluxKit
        product: AlteraluxUI
    # Code signing, sandbox entitlements and hardened runtime.
    configFiles:
      Debug: Alteralux/Signing.xcconfig
      Release: Alteralux/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Alteralux
        PRODUCT_BUNDLE_IDENTIFIER: io.github.davidelarocca.alteralux
        # Document types live in Info.plist; everything else is generated.
        INFOPLIST_FILE: Alteralux/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: alteralux
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: "Free software under the GNU GPL v3. Film modeling powered by spektrafilm."
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
