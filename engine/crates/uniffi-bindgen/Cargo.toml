[package]
name = "uniffi-bindgen"
description = "Generates the Swift bindings for alteralux-ffi (build tool, not shipped)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
